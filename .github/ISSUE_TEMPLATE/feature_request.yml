name: 功能建议
description: 描述想改善的桌面使用场景
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: "先描述想完成的事情，以及目前遇到的阻碍。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考（可选）
